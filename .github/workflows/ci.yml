name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  members-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: members-service/package-lock.json

      - name: Install dependencies
        working-directory: members-service
        run: npm ci

      - name: Run tests
        working-directory: members-service
        run: npm test

  facilities-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: facilities-service/requirements.txt

      - name: Install dependencies
        working-directory: facilities-service
        run: python -m pip install -r requirements.txt

      - name: Generate gRPC stubs
        working-directory: facilities-service
        run: python -m grpc_tools.protoc -I ./proto --python_out=./src --grpc_python_out=./src ./proto/facilities.proto

      - name: Run tests
        working-directory: facilities-service
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_*.py"

  bookings-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: bookings-service/bookings
        run: chmod +x mvnw

      - name: Run tests
        working-directory: bookings-service/bookings
        run: ./mvnw test

  publish-docker-images:
    name: Publish images to Docker Hub
    runs-on: ubuntu-latest
    needs:
      - members-tests
      - facilities-tests
      - bookings-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: members-service
            context: members-service
          - image: facilities-service
            context: facilities-service
          - image: bookings-service
            context: bookings-service/bookings
          - image: mobile-gateway
            context: mobile-gateway
          - image: frontend-shell
            context: frontend
          - image: api-gateway
            context: api-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
