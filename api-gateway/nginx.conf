events {}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    absolute_redirect off;
    set $members_backend members-service:3001;
    set $bookings_backend bookings-service:8080;

    location = /health {
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # Keep canonical trailing-slash prefixes for gateway groups.
    location = /members {
      return 308 /members/;
    }

    location /members/ {
      proxy_pass http://$members_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /members/docs {
      return 302 /members/docs/;
    }

    location /members/docs/ {
      rewrite ^/members/docs/(.*)$ /docs/$1 break;
      proxy_pass http://$members_backend;
      proxy_set_header Host $host;
      proxy_redirect /docs/ /members/docs/;
    }

    location = /members/health {
      proxy_pass http://$members_backend/health;
      proxy_set_header Host $host;
    }

    location /bookings/ {
      proxy_pass http://$bookings_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prevent nginx auto-redirect from /bookings -> /bookings/
    # because swagger "Try it out" uses /bookings exactly.
    location = /bookings {
      proxy_pass http://$bookings_backend/bookings;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bookings/swagger-ui/ {
      rewrite ^/bookings/swagger-ui/(.*)$ /swagger-ui/$1 break;
      proxy_pass http://$bookings_backend;
      proxy_set_header Host $host;
    }

    # Convenience alias for manual testing.
    location = /bookings/docs {
      return 302 swagger-ui/index.html;
    }

    location /bookings/v3/api-docs {
      rewrite ^/bookings/v3/api-docs(.*)$ /v3/api-docs$1 break;
      proxy_pass http://$bookings_backend;
      proxy_set_header Host $host;
    }

    location /bookings/v3/api-docs/ {
      rewrite ^/bookings/v3/api-docs/(.*)$ /v3/api-docs/$1 break;
      proxy_pass http://$bookings_backend;
      proxy_set_header Host $host;
    }

    # Swagger UI may request the config URL from /v3/api-docs/swagger-config.
    location = /v3/api-docs {
      proxy_pass http://$bookings_backend/v3/api-docs;
      proxy_set_header Host $host;
    }

    location /v3/api-docs/ {
      proxy_pass http://$bookings_backend/v3/api-docs/;
      proxy_set_header Host $host;
    }

    location = /v3/api-docs/swagger-config {
      proxy_pass http://$bookings_backend/v3/api-docs/swagger-config;
      proxy_set_header Host $host;
    }
  }
}
