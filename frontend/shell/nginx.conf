server {
  listen 8080;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  set $api_gateway api-gateway:8080;
  set $mobile_gateway mobile-gateway:8081;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Variable proxy_pass disables nginx's automatic prefix strip, so we
  # rewrite the path explicitly before forwarding to the upstream.
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /mobile/ {
    rewrite ^/mobile/(.*)$ /$1 break;
    proxy_pass http://$mobile_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v3/api-docs {
    proxy_pass http://$api_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
